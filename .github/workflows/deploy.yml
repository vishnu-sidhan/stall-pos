name: Deploy Example to GitHub Pages & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies (root package)
        run: flutter pub get

      - name: Run static analysis (root package)
        run: dart analyze

      - name: Run tests (root package)
        run: flutter test

      - name: Install dependencies (example app)
        working-directory: example
        run: flutter pub get

      - name: Run static analysis (example app)
        working-directory: example
        run: dart analyze

      - name: Run tests (example app)
        working-directory: example
        run: flutter test

      - name: Build Web release bundle
        working-directory: example
        run: flutter build web --release --base-href "/stall-pos/"

      - name: Build Android Release APK
        working-directory: example
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stall-pos-release-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Copies the APK into the web output so it can also be downloaded directly from GitHub Pages
      - name: Copy APK to Web bundle
        run: cp example/build/app/outputs/flutter-apk/app-release.apk example/build/web/stall-pos.apk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
          publish_branch: gh-pages